name: Delegate workspace export

on:
  push:
    branches:
      - delegate/slop-extension-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source revision
        run: |
          git rev-parse HEAD > DELEGATE-WORKSPACE-REVISION
          git status --short --branch

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: delegate-slop-workspace
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .
            !.git/**
