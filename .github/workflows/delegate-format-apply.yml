name: Apply Delegate formatting

on:
  push:
    branches:
      - delegate/slop-extension-v0.1

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: stage Delegate formatting'"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: delegate/slop-extension-v0.1
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format only Delegate files
        shell: bash
        run: |
          set -euo pipefail
          bun x @biomejs/biome format --write \
            src/lib/delegation-policy.mjs \
            src/lib/delegation-policy.test.ts \
            tests/fixtures/delegate-policy/valid-policy.json
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/lib/delegation-policy.mjs \
            src/lib/delegation-policy.test.ts \
            tests/fixtures/delegate-policy/valid-policy.json | sort)"
          test "$actual" = "$expected"

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Delegate implementation bot"
          git config user.email "delegate-implementation@users.noreply.github.com"
          git add \
            src/lib/delegation-policy.mjs \
            src/lib/delegation-policy.test.ts \
            tests/fixtures/delegate-policy/valid-policy.json
          git commit -m "style: format Delegate project opt-in"
          git push origin HEAD:refs/heads/delegate/slop-extension-v0.1
